<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Village</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="background"></canvas>
    <div id="stage">
      <h1 id="title"></h1>
      <div id="frame">
        <span class="corner corner-tl"></span>
        <span class="corner corner-tr"></span>
        <span class="corner corner-bl"></span>
        <span class="corner corner-br"></span>
        <div id="game">
          <div id="name-tags" class="name-tags"></div>
        </div>
      </div>
      <div class="hud">
        <div class="counters">
          <div class="counter"><span class="swatch stone"></span><span id="stone-counter"></span></div>
          <div class="counter"><span class="swatch wood"></span><span id="wood-counter"></span></div>
          <div class="counter"><span class="swatch fish"></span><span id="fish-counter"></span></div>
        </div>
        <div class="toggles">
          <button class="sound-toggle" id="soundBtn" type="button" aria-pressed="false">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M2 6H4.5L8 3V13L4.5 10H2V6Z" fill="currentColor" />
              <path id="soundWave" d="M10.5 5.5C11.5 6.5 11.5 9.5 10.5 10.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
            </svg>
            <span id="soundLabel"></span>
          </button>
          <button class="notify-toggle" id="notifyBtn" type="button" aria-pressed="false">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M8 2.5C6.6 2.5 5.6 3.7 5.6 5.2V7.6C5.6 8.8 5.1 9.7 4.2 10.3H11.8C10.9 9.7 10.4 8.8 10.4 7.6V5.2C10.4 3.7 9.4 2.5 8 2.5Z" fill="currentColor" />
              <path d="M6.6 11.5C6.6 12.3 7.2 13 8 13C8.8 13 9.4 12.3 9.4 11.5" stroke="currentColor" stroke-width="1" />
            </svg>
            <span id="notifyLabel"></span>
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

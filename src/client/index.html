<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Village</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="background"></canvas>
    <div id="stage">
      <h1 id="title"></h1>
      <div id="board">
        <span class="corner corner-tl"></span>
        <span class="corner corner-tr"></span>
        <span class="corner corner-bl"></span>
        <span class="corner corner-br"></span>
        <div class="board-main">
          <button class="panel-toggle" id="panelToggleBtn" type="button" aria-expanded="true"></button>
          <aside class="side-panel">
            <div class="side-panel-inner">
              <div class="side-tabs" role="tablist">
                <button class="side-tab" id="sessionsTabBtn" type="button" aria-selected="true"></button>
                <button class="side-tab" id="settingsTabBtn" type="button" aria-selected="false"></button>
              </div>
              <div class="side-tab-panel" id="sessionsTabPanel">
                <ul id="session-list" class="session-list"></ul>
              </div>
              <div class="side-tab-panel" id="settingsTabPanel" hidden>
                <div class="toggles">
                  <button class="sound-toggle" id="soundBtn" type="button" aria-pressed="false">
                    <span id="soundLabel" class="toggle-name"></span>
                    <span class="toggle-status"></span>
                  </button>
                  <button class="notify-toggle" id="notifyBtn" type="button" aria-pressed="false">
                    <span id="notifyLabel" class="toggle-name"></span>
                    <span class="toggle-status"></span>
                  </button>
                  <button class="theme-toggle" id="themeBtn" type="button">
                    <span id="themeLabel" class="toggle-name"></span>
                    <span class="toggle-status" id="themeStatus"></span>
                  </button>
                </div>
              </div>
            </div>
          </aside>
          <div class="game-column">
            <div id="game">
              <div id="name-tags" class="name-tags"></div>
            </div>
            <div class="counters">
              <div class="counter"><span class="swatch stone"></span><span id="stone-counter"></span></div>
              <div class="counter"><span class="swatch wood"></span><span id="wood-counter"></span></div>
              <div class="counter"><span class="swatch fish"></span><span id="fish-counter"></span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
